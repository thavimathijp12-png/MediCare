spring.datasource.url=jdbc:h2:mem:medicare;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

medicare.jwt.expiration-ms=86400000

MEDICARE_BOOTSTRAP_ADMIN_EMAIL=admin@medicare.health
MEDICARE_BOOTSTRAP_ADMIN_PASSWORD=AdminPass123!

