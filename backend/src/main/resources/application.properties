server.port=${SERVER_PORT:8080}
spring.application.name=medicare-backend

spring.datasource.url=${MEDICARE_DB_URL:jdbc:h2:file:./data/medicare;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${MEDICARE_DB_USERNAME:sa}
spring.datasource.password=${MEDICARE_DB_PASSWORD:}
spring.datasource.driver-class-name=${MEDICARE_DB_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

medicare.jwt.secret=${MEDICARE_JWT_SECRET}
medicare.jwt.expiration-ms=${MEDICARE_JWT_EXPIRATION:86400000}
medicare.cors.allowed-origins=${MEDICARE_CORS_ALLOWED_ORIGINS:http://localhost:5501,http://127.0.0.1:5501,http://localhost:5503,http://127.0.0.1:5503}

spring.mail.host=${MEDICARE_SMTP_HOST:}
spring.mail.port=${MEDICARE_SMTP_PORT:587}
spring.mail.username=${MEDICARE_SMTP_USERNAME:}
spring.mail.password=${MEDICARE_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
medicare.contact.from=${MEDICARE_CONTACT_FROM:}
medicare.contact.recipient=${MEDICARE_CONTACT_RECIPIENT:}
medicare.payments.stripe-secret-key=${MEDICARE_STRIPE_SECRET_KEY:}
medicare.payments.stripe-webhook-secret=${MEDICARE_STRIPE_WEBHOOK_SECRET:}
medicare.payments.success-url=${MEDICARE_STRIPE_SUCCESS_URL:http://localhost:5502/?payment=success}
medicare.payments.cancel-url=${MEDICARE_STRIPE_CANCEL_URL:http://localhost:5502/?payment=cancelled}

logging.level.com.medicare=INFO
logging.level.org.springframework.security=WARN
